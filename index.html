<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Dino Bieg</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>🦕 Dino Bieg — tryb społecznościowy 🦕</h1>

    <div id="select-screen" class="screen">
      <h2>Wybierz swojego dinozaura</h2>
      <div id="character-grid"></div>

      <div id="join-form">
        <input id="name-input" type="text" maxlength="16" placeholder="Twój nick">
        <input id="server-input" type="text" placeholder="Adres serwera (ws://...)">
      </div>
      <p id="conn-status" class="hint">🔌 Niepołączono</p>

      <button id="start-btn" disabled>Start!</button>
    </div>

    <div id="game-screen" class="screen hidden">
      <div id="hud">
        <span id="online-label">Online: 0</span>
        <span id="hearts-label">🤝 Przybite piątki: 0</span>
        <button id="leave-btn">Zmień dinozaura</button>
      </div>
      <div id="game-wrap">
        <canvas id="game-canvas" width="900" height="420"></canvas>
        <button id="highfive-btn" class="hidden">🖐 Przybij piątkę!</button>
        <div id="highfive-toast" class="hidden"></div>
      </div>

      <div id="emote-row">
        <button class="emote-btn" data-emoji="👋" title="Pomachaj">👋</button>
        <button class="emote-btn" data-emoji="❤️" title="Serduszko">❤️</button>
        <button class="emote-btn" data-emoji="😂" title="Śmiech">😂</button>
        <button class="emote-btn" data-emoji="😮" title="Zdziwienie">😮</button>
      </div>

      <div id="chat-panel">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="140" placeholder="Napisz coś do innych...">
          <button type="submit">Wyślij</button>
        </form>
      </div>

      <p class="hint">Strzałki / WASD = ruch. Podejdź do kogoś, żeby przybić piątkę!</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
